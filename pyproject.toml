[project]
name = "multitemporal-rs-agent"
version = "0.1.0"
description = "A minimal, transparent image-inspection agent demo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.1.0,<13",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rs_agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
